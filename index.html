<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ocean Zero — Tactical naval warfare browser game. Place your fleet and destroy the enemy before they sink yours.">
        <title>Ocean Zero — Tactical Warfare</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <h1>⚓ Ocean Zero</h1>
        <h3>Tactical Warfare — Deploy your fleet</h3>

        <div class="container">

            <!-- Turn indicator (shown after game starts) -->
            <div id="turn-indicator" class="turn-indicator" style="display:none;"></div>

            <!-- Game boards -->
            <div id="boards-container" class="row layout--desktop">
                <div class="col board-section">
                    <p class="board-section__title">Your Fleet</p>
                    <div id="board"></div>
                </div>
                <div class="col board-section">
                    <p class="board-section__title">Enemy Waters</p>
                    <div id="boardAttack"></div>
                </div>
            </div>

            <!-- Ship selector -->
            <h4>Select a ship to place</h4>
            <div id="ships" class="row"></div>

            <!-- Start button -->
            <div class="row" style="justify-content:center; margin-top:1rem;">
                <button id="button">⚡ Start Battle</button>
            </div>

        </div>

        <!-- Game logic — ES6 module -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
