<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="./css/styles.css">

    <title>BattleShip Game</title>

</head>

<body>

    <h1>BattleShip</h1>
    <h3>Select ship positions</h3>

    <div class="container">

        <div class="row">

            <div class="col">
                <div id="board"></div>
            </div>

            <div class="col">
                <div id="boardAttack"></div>
            </div>

        </div>

        <h4>Your ships:</h4>

        <div id="ships" class="row">

            <div class="col">

                <div>
                    <span>Carrier</span><br>
                    <span>Size: 5</span>
                </div>

                <div class="position"></div>

            </div>

            <div class="col">

                <div>
                    <span>Battleship</span><br>
                    <span>Size: 4</span>
                </div>

                <div class="position"></div>

            </div>

            <div class="col">

                <div>
                    <span>Submarine</span><br>
                    <span>Size: 3</span>
                </div>

                <div class="position"></div>

            </div>

            <div class="col">

                <div>
                    <span>Destroyer</span><br>
                    <span>Size: 2</span>
                </div>

                <div class="position"></div>

            </div>

        </div>

        <div class="row">
            <button id="startGameButton">
                Start Game
            </button>
        </div>

    </div>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
